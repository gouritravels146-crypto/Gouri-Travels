<meta name="theme-color" content="#f5f2ea"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--pr:#0b6b5d;--pd:#08524a;--ac:#ff6a3d;--ink:#12201c;--mu:#5f6b66;--bg:#f5f2ea;--cd:#fff;--bd:#e4e0d4;--bk:#d3d8d5;--sh:0 1px 2px rgba(18,32,28,.05),0 10px 28px rgba(18,32,28,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'DM Sans','Noto Sans Bengali',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque','Noto Sans Bengali',sans-serif;font-weight:700;margin:0;line-height:1.15;letter-spacing:-.02em}
a{color:inherit}.w{max-width:1040px;margin:0 auto;padding:0 20px}.mu{color:var(--mu);font-size:14px}.c{text-align:center}
.nav{position:sticky;top:0;z-index:40;background:rgba(245,242,234,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.nin{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand img{height:36px;width:36px;object-fit:contain;border-radius:10px}.brand b{font:800 18px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}.brand b span{color:var(--ac)}
.acct{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--mu);flex-wrap:wrap;justify-content:flex-end}.acct a{color:var(--pr);font-weight:700;text-decoration:none}
.gbtn{background:#fff;border:1px solid var(--bd);border-radius:99px;padding:8px 16px;font:700 13px 'DM Sans',sans-serif;cursor:pointer;color:var(--ink)}
.lnk{background:none;border:0;font:700 14px 'DM Sans',sans-serif;color:var(--pr);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:end;padding-top:48px;padding-bottom:12px}
.pill{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--pr)}
.hero h1{font-size:clamp(40px,8vw,72px);margin:18px 0 16px;font-weight:800}.hero p{max-width:480px;font-size:17px;color:var(--mu);margin:0 0 24px}
.hbtn{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;gap:10px}.stat{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px 20px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center}.stat b{font:800 28px 'Bricolage Grotesque',sans-serif;color:var(--pr)}.stat span{font-size:13px;color:var(--mu)}
.notice{background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;margin:22px auto 0;font-size:14.5px}
h2.sec{font-size:clamp(26px,5vw,36px);margin:64px 0 22px;text-align:left}h2.sec svg{display:none}
.arches{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.arch{display:block;text-decoration:none;background:var(--cd);border:1px solid var(--bd);border-radius:24px;overflow:hidden;box-shadow:var(--sh);transition:transform .2s}.arch:hover{transform:translateY(-3px)}
.arch.big{grid-column:1/-1;display:grid;grid-template-columns:1.1fr 1fr}
.af{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#cfe3dc,#f2dccf);overflow:hidden}.af img{width:100%;height:100%;object-fit:cover;display:block}
.af .kd{position:absolute;left:12px;top:12px;margin:0;background:rgba(255,255,255,.92);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:.06em}
.af .st{position:absolute;right:12px;bottom:12px;background:var(--ac);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700}.af .st.off{background:var(--ink)}
.ab{padding:18px 20px 20px;display:flex;flex-direction:column;justify-content:center}.ab h3{font-size:21px}.arch.big .ab h3{font-size:clamp(24px,4vw,34px)}
.am{font-size:14px;color:var(--mu);margin:6px 0 12px}.ar{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.price{font:800 22px 'Bricolage Grotesque',sans-serif;color:var(--pr)}
.bar{height:6px;background:var(--bd);border-radius:9px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding-top:30px}.arch.big{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:99px;padding:13px 26px;background:var(--pr);color:#fff;font:700 15px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--pd)}.btn.alt{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}.btn.ye{background:var(--ac);color:#fff}.btn.wa{background:var(--pr)}.btn.red{background:#b3261e}
.btn.sm{padding:7px 15px;font-size:13px}.btn:disabled{opacity:.5}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.wy{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:20px}.wy i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#dff0ea;color:var(--pr);font:800 16px 'Bricolage Grotesque',sans-serif;font-style:normal;margin-bottom:12px}.wy h3{font-size:18px;margin-bottom:6px}.wy p{margin:0;font-size:14.5px;color:var(--mu)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.step{background:var(--ink);color:#fff;border-radius:22px;padding:22px}.step i{font:800 40px 'Bricolage Grotesque',sans-serif;color:var(--ac);font-style:normal}.step h3{font-size:19px;margin:6px 0}.step .gl{display:none}.step p{margin:0;font-size:14.5px;opacity:.8}
.rev{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:18px 20px;margin:12px 0;font-size:16px}.rev .mu{margin-top:6px}
details{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin:10px 0}summary{cursor:pointer;font-weight:700}details p{margin:8px 0 0;color:var(--mu)}
.ft{background:var(--ink);color:#fff;margin-top:72px;padding:52px 0 30px;border-radius:32px 32px 0 0}.ft h2{font-size:clamp(28px,6vw,44px);color:#fff}.circ{color:var(--ac)}.circ svg{display:none}
.gl2{height:1px;background:rgba(255,255,255,.15);margin:26px 0 20px}.sm{letter-spacing:.12em;font-size:12px;margin:0 0 16px;opacity:.7}
.cts{display:flex;gap:14px;flex-wrap:wrap}.ct2{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 18px}
.ct2 i{font-style:normal;font-size:22px}.ct2 span{font-size:11px;letter-spacing:.12em;opacity:.8}.ct2 b{display:block;font:700 17px 'DM Sans',sans-serif;letter-spacing:0}.cp{margin:30px 0 0;font-size:12.5px;opacity:.6}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;overflow:hidden;display:block;color:inherit;text-decoration:none}
.pad{padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{font-size:13px;font-weight:700;padding:4px 14px;border-radius:99px;white-space:nowrap}
.on{background:var(--pr);color:#fff}.soon{background:#fff;color:var(--mu);border:1px solid var(--bd)}
.slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 20px}.slider img{height:300px;min-width:78%;max-width:420px;object-fit:cover;border-radius:22px;scroll-snap-align:center}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.fact{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px 16px}.fact span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.fact b{font:700 17px 'DM Sans',sans-serif}
.sec-card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:20px;margin:14px 0;box-shadow:var(--sh)}.sec-card h3{margin-bottom:12px;font-size:19px}
.ov{white-space:pre-wrap}.ul{list-style:none;padding:0;margin:0}.ul li{padding:5px 0 5px 26px;position:relative}.ul li:before{content:"✓";position:absolute;left:0;color:var(--pr);font-weight:700}.ul.x li:before{content:"✕";color:#b3261e}
.tl{border-left:2px solid var(--bd);margin-left:8px;padding-left:18px}.tl div{position:relative;padding:6px 0 10px}.tl div:before{content:"";position:absolute;left:-25px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:3px solid var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bus{background:#fff;border:2px solid var(--bd);border-radius:30px;padding:16px;max-width:310px;margin:14px auto}
.drv{text-align:right;color:var(--mu);font-size:13px}.row{display:flex;gap:6px;justify-content:center;margin:6px 0}.gap{width:26px}
.seat{width:44px;height:44px;border-radius:12px;border:2px solid var(--pr);background:#fff;color:var(--ink);font:700 12px 'DM Sans',sans-serif;cursor:pointer}
.seat.bk{background:var(--bk);border-color:var(--bk);color:var(--mu);cursor:not-allowed;text-decoration:line-through}
.seat.hd{background:var(--ac);border-color:var(--ac);color:#fff;cursor:not-allowed}.seat.sel{background:var(--pr);color:#fff}
.seat.ad.bk{background:#b3261e;border-color:#b3261e;color:#fff;text-decoration:none;cursor:pointer}.seat.ad.hd{cursor:pointer}
.leg{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mu);flex-wrap:wrap}.leg i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:2px solid var(--pr)}
.sbar{position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:12px 20px;z-index:25}
.sbar .in{max-width:1040px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:14px;font:inherit;margin:4px 0 10px;background:#fff;color:var(--ink)}input:focus,textarea:focus{outline:2px solid var(--pr);border-color:var(--pr)}
label{font-size:13px;color:var(--mu)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.warn{background:#fff3d6;color:#5c4400;border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}.gal img{width:100%;height:100px;object-fit:cover;border-radius:12px}.ct{display:flex;gap:4px;justify-content:center;margin-top:4px}
table{width:100%;font-size:13px;border-collapse:collapse}td{padding:6px;border-top:1px solid var(--bd)}
.tk{max-width:420px;margin:22px auto;background:#fff;border-radius:24px;overflow:hidden;border:1px solid var(--bd);box-shadow:var(--sh)}
.tk .hd{background:var(--pr);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.tk .hd img{height:50px;background:#fff;border-radius:50%;padding:3px}.tk .ok{border:1px solid #fff;font-size:12px;padding:3px 12px;border-radius:99px;display:inline-block;margin-top:6px}
.tk .bd{padding:20px}.tk .big{font:700 23px 'Bricolage Grotesque',sans-serif}.tk .lbl{font-size:11px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase;margin-top:14px}
.tk .v{font-weight:700}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.chips span{background:var(--pr);color:#fff;border-radius:9px;padding:4px 12px;font-weight:700}
.tk .cut{border-top:2px dashed var(--bd);margin:18px -20px}.tk .qr{text-align:center}.tk .qr svg{width:150px;height:150px}
.tk .code{font-family:monospace;font-size:20px;font-weight:700;letter-spacing:.08em;text-align:center;margin-top:6px}
.kinds{display:flex;gap:8px;margin:12px 0 6px;flex-wrap:wrap}
.ksw{display:flex;align-items:center;gap:8px;border:1.5px solid var(--bd);background:#fff;border-radius:99px;padding:6px 14px 6px 8px;font:700 14px 'DM Sans',sans-serif;color:var(--mu);cursor:pointer}
.ksw:before{content:"";width:34px;height:20px;border-radius:99px;background:var(--bk) radial-gradient(circle at 10px 10px,#fff 8px,transparent 9px)}
.ksw.on{border-color:var(--pr);color:var(--pr)}.ksw.on:before{background:var(--pr) radial-gradient(circle at 24px 10px,#fff 8px,transparent 9px)}
[data-kind="bus"] .kf-train,[data-kind="bus"] .kf-sc,[data-kind="train"] .kf-bus,[data-kind="train"] .kf-sc,[data-kind="scorpio"] .kf-bus,[data-kind="scorpio"] .kf-train{display:none}
.cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}
.car{background:#fff;border:2px solid var(--bd);border-radius:26px;padding:12px 14px}
.ch{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;text-align:center}.ch span{font-size:12px;color:var(--mu)}
.cs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.cs .dv{width:44px;height:44px;display:grid;place-items:center;font-size:20px}
.stp{display:flex;align-items:center;justify-content:center;gap:18px}.stp b{font:800 30px 'Bricolage Grotesque',sans-serif;min-width:40px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:12px 0}.tgrid .seat{width:100%}
.kd{font-size:11px;letter-spacing:.1em;color:var(--mu);margin-top:12px}
.ov-modal{position:fixed;inset:0;background:rgba(18,32,28,.55);z-index:90;display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border-radius:26px;padding:26px;max-width:380px;width:100%;text-align:center;display:grid;gap:12px;max-height:92vh;overflow:auto}.mbox h3{font-size:28px}.mbox .qr svg{width:170px;height:170px}
@media print{.nav,.noprint,.ft{display:none!important}body{background:#fff}.tk{margin:0 auto;box-shadow:none}}

.hero{background:var(--ink);color:#fff;border-radius:32px;margin:16px auto 0;padding:48px 32px 40px;width:calc(100% - 24px);max-width:1040px}
.hero h1 em{color:var(--ac);font-style:normal}.hero p{color:#cfd8d4}.hero .pill{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}.hero .btn.alt{color:#fff;border-color:#fff}.hero .btn:not(.alt){background:var(--ac)}
.hero .stat{background:rgba(255,255,255,.08);border:0;box-shadow:none}.hero .stat b{color:var(--ac)}.hero .stat span{color:#cfd8d4}
.cdn{display:inline-block;background:#fff1ea;color:#b3401c;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums}
.cdn.big{display:block;text-align:center;font-size:17px;padding:12px;border-radius:16px;margin:0 0 4px}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 16px}
.days{display:grid;gap:14px}.day{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start}.day>b{background:var(--pr);color:#fff;border-radius:14px;text-align:center;padding:8px 4px;font:700 13px 'Bricolage Grotesque',sans-serif}.day h4{margin:0 0 4px;font:700 17px 'Bricolage Grotesque',sans-serif}.day p{margin:0;color:var(--mu);font-size:14.5px}
.meal{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--bd)}.meal:first-of-type{border-top:0}.meal b{font-size:14px}.meal span{color:var(--mu);font-size:14.5px}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--ink);margin-top:6px}.chk input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--pr)}
.trkp{display:flex;align-items:center;gap:14px;background:#f1f6f4;border-radius:16px;padding:14px 16px}.trkp b{font:800 36px 'Bricolage Grotesque',sans-serif;color:var(--ac)}.trkp span{font-size:14px;color:var(--mu)}
@media(max-width:560px){.hero{padding:34px 20px 28px;border-radius:26px}.meal{grid-template-columns:1fr;gap:2px}}
.hide{display:none!important}
.tabs{display:flex;gap:8px;margin:0 0 16px}.tab{border:1.5px solid var(--bd);background:#fff;border-radius:99px;padding:9px 22px;font:700 14px 'DM Sans',sans-serif;cursor:pointer;color:var(--mu)}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tcs{display:grid;gap:10px}.tc{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh)}.tc:active{transform:scale(.99)}.tc.past{opacity:.6}
.tcd{flex:none;width:64px;text-align:center;background:var(--ink);color:#fff;border-radius:14px;padding:8px 4px}.tcd b{display:block;font:800 24px 'Bricolage Grotesque',sans-serif;line-height:1}.tcd span{font-size:11px;opacity:.8}
.tci{flex:1;min-width:0}.tci h4{margin:0;font:700 17px 'Bricolage Grotesque',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tci p{margin:2px 0 0;font-size:13px;color:var(--mu)}.tci .hl{color:var(--ac)}
.ah{display:flex;gap:12px;align-items:center;background:#eef5f2;border-radius:16px;padding:10px 14px;margin:22px 0 10px}.ah i{font-style:normal;font-size:22px;width:42px;height:42px;display:grid;place-items:center;background:#fff;border-radius:12px;flex:none;box-shadow:var(--sh)}.ah b{display:block;font:700 16px 'Bricolage Grotesque',sans-serif}.ah span{font-size:12.5px;color:var(--mu)}
.dcard{background:#fafaf6;border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.dh b{font:800 20px 'Bricolage Grotesque',sans-serif;color:var(--pr)}
.blk{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}.bh{display:flex;justify-content:space-between;align-items:center;gap:8px}.bh>span{font-weight:700}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--pr);margin:0}.sw input{width:18px;height:18px;margin:0;accent-color:var(--pr)}
.thm{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.thm div{position:relative}.thm img{width:84px;height:64px;object-fit:cover;border-radius:10px;display:block}.thm button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#b3261e;color:#fff;font-size:12px;cursor:pointer}
.addp{display:inline-block;border:1.5px dashed var(--pr);color:var(--pr);border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;margin:2px 0}
.dys{display:grid;gap:16px}.dy{border:1px solid var(--bd);border-radius:18px;padding:14px;background:#fafaf6}.dyh{display:flex;gap:12px;align-items:center;margin-bottom:8px}.dyh b{background:var(--pr);color:#fff;border-radius:12px;padding:6px 12px;font:700 13px 'Bricolage Grotesque',sans-serif;white-space:nowrap}.dyh h4{margin:0;font:700 18px 'Bricolage Grotesque',sans-serif}
.dyb{display:grid;grid-template-columns:32px 1fr;gap:10px;margin-top:10px;min-width:0}.dyb .ic{font-size:20px}.dyb p{margin:0;white-space:pre-line}.dyb h5{margin:0 0 2px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.dimg{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scroll-snap-type:x mandatory;padding-bottom:4px}.dimg img{height:150px;width:auto;min-width:200px;max-width:260px;object-fit:cover;border-radius:14px;scroll-snap-align:start;flex:none}

  return '<a class="arch'+(big?' big':'')+'" data-k="'+(t.kind||'bus')+'" href="#t-'+t.id+'"><div class="af">'+(t.thumb?'<img src="'+esc(t.thumb)+'" loading="lazy" alt="">':'')+'<span class="kd">'+kindTag(t)+'</span><span class="st'+(on?'':' off')+'">'+(on?l+' packages left':closed(t)?'Booking closed':'Coming soon')+'</span></div><div class="ab"><h3>'+esc(t.title)+'</h3><div class="am">'+(route(t)||'')+'</div><div class="ar"><span>'+fd(t.trip_date)+'</span><span class="price">'+(t.price>0?'₹'+t.price+' <small class="mu">/ package</small>':'')+'</span></div>'+(on?cdHTML(t):'')+(on?'<div class="bar"><i style="width:'+pc+'%"></i></div>':'')+'</div></a>'}
const DWHY="Choose your package|Pick the package that suits your group.\nHeld for 15 minutes|Your package stays reserved while you pay.\nPay by UPI|GPay, PhonePe or Paytm. Quick and simple.\nE-ticket with QR|Show it on your phone at boarding.";
function home(){
  const T=S.trips,f=T[0],open=T.reduce((a,t,i)=>a+(canBook(t,i)?left(t):0),0);

  if(S.set.notice)h+='<div class="notice">📣 '+esc(S.set.notice)+'</div>';
  h+='<section id="trips"><h2 class="sec">Upcoming trips'+SCR+'</h2>'+(new Set(T.map(t=>t.kind||'bus')).size>1?'<div class="fl"><button class="ksw on" data-f="all">All</button>'+['bus','train','scorpio'].filter(k=>T.some(t=>(t.kind||'bus')===k)).map(k=>'<button class="ksw" data-f="'+k+'">'+k[0].toUpperCase()+k.slice(1)+'</button>').join('')+'</div>':'')+(T.length?'<div class="arches">'+T.map((t,i)=>arch(t,i,i===0)).join('')+'</div>':'<p class="mu">New trips coming soon.</p>')+'</section>';
  h+='<h2 class="sec">Why travel with us'+SCR+'</h2><div class="why">'+lines(S.set.why||DWHY).map((q,i)=>{const p=q.split('|');return '<div class="wy"><i>'+(i+1)+'</i><h3>'+esc(p[0])+'</h3><p>'+esc(p[1]||'')+'</p></div>'}).join('')+'</div>';
  h+='<h2 class="sec">How it works'+SCR+'</h2><div class="steps"><div class="step"><i>01</i><h3>Pick a trip &amp; package</h3><p>See the options and tap the package you want.</p></div><div class="step"><i>02</i><h3>Hold &amp; pay</h3><p>Your package is held for 15 minutes. Pay by UPI.</p></div><div class="step"><i>03</i><h3>Get your e-ticket</h3><p>We confirm your package and your ticket is ready.</p></div></div>';
  const rv=lines(S.set.reviews);if(rv.length)h+='<h2 class="sec">What travellers say'+SCR+'</h2>'+rv.map(r=>{const p=r.split('|');return '<div class="rev">“'+esc(p[1]||p[0])+'”'+(p[1]?'<div class="mu">— '+esc(p[0])+'</div>':'')+'</div>'}).join('');
  h+='<h2 class="sec">Questions'+SCR+'</h2>'+lines(S.set.faq||DFAQ).map(q=>{const p=q.split('|');return '<details><summary>'+esc(p[0])+'</summary><p>'+esc(p[1]||'')+'</p></details>'}).join('')+'</main>'+foot();
  $('root').innerHTML=h;$('vt').onclick=()=>{const e=$('trips');e&&e.scrollIntoView()};
  document.querySelectorAll('.fl .ksw').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fl .ksw').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.arch').forEach(a=>a.style.display=(b.dataset.f==='all'||a.dataset.k===b.dataset.f)?'':'none')});
}
const upiLink=(a,n)=>'upi://pay?pa='+encodeURIComponent(S.set.upi)+'&pn='+encodeURIComponent(S.set.upi_name||'Gouri Travels')+'&am='+a+'&cu=INR&tn='+encodeURIComponent(n||'Gouri Travels booking');
function payBox(t,tot,msg){
  let qr='';try{const q=qrcode(0,'M');q.addData(upiLink(tot,t.title));q.make();qr=q.createSvgTag(5)}catch(e){}
  const o=document.createElement('div');o.className='ov-modal';
  o.innerHTML='<div class="mbox"><h3>Pay ₹'+tot+'</h3><p class="mu" style="margin:0">Package held for 15 minutes.</p><a class="btn" href="'+esc(upiLink(tot,t.title))+'">Pay with UPI app</a><div class="qr">'+qr+'</div><p class="mu" style="margin:0">On a computer, scan with any UPI app.<br>UPI ID: <b>'+esc(S.set.upi)+'</b></p>'+(S.set.wa?'<button class="btn alt" id="pd">I have paid · send screenshot</button>':'')+'<button class="lnk" id="px">Close</button></div>';
  document.body.appendChild(o);
  if($('pd'))$('pd').onclick=()=>{location.href=waLink(msg+'\nPaid ₹'+tot+' by UPI. Screenshot attached.')};
  $('px').onclick=()=>{o.remove();load().then(render)};
}
function list(a,c){return a.length?'<ul class="ul '+(c||'')+'">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}
function dayCards(d){let D=[];try{D=JSON.parse(d.days||'[]')}catch(e){}
  if(!D.length){let r='';
  if(d.it)r+='<div class="sec-card"><h3>Day-wise plan</h3><div class="days">'+lines(d.it).map(x=>{const p=x.split('|');return p.length>1?'<div class="day"><b>'+esc(p[0])+'</b><div><h4>'+esc(p[1])+'</h4>'+(p[2]?'<p>'+esc(p.slice(2).join('|'))+'</p>':'')+'</div></div>':'<div class="day"><b>•</b><div><p>'+esc(x)+'</p></div></div>'}).join('')+'</div></div>';
  if(d.meal)r+='<div class="sec-card"><h3>Food menu</h3>'+lines(d.meal).map(x=>{const p=x.split('|');return '<div class="meal"><b>'+esc(p[0])+'</b><span>'+esc(p[1]||'')+'</span></div>'}).join('')+'</div>';
  return r}
  const im=(a,on)=>on&&a&&a.length?'<div class="dimg">'+a.map(u=>'<img src="'+esc(u)+'" loading="lazy" alt="">').join('')+'</div>':'';
  return '<div class="sec-card"><h3>Day-wise plan</h3><div class="dys">'+D.map((x,i)=>'<div class="dy"><div class="dyh"><b>Day '+(i+1)+'</b><h4>'+esc(x.t||'')+'</h4></div>'+((x.d||(x.dimOn&&(x.dim||[]).length))?'<div class="dyb"><span class="ic">🗺️</span><div>'+(x.d?'<p>'+esc(x.d)+'</p>':'')+im(x.dim,x.dimOn)+'</div></div>':'')+((x.m||(x.mimOn&&(x.mim||[]).length))?'<div class="dyb"><span class="ic">🍽️</span><div><h5>Food</h5>'+(x.m?'<p>'+esc(x.m)+'</p>':'')+im(x.mim,x.mimOn)+'</div></div>':'')+'</div>').join('')+'</div></div>'}
function trip(t,i){
  const on=canBook(t,i),d=parse(t.details),ph=[t.thumb].concat(t.photos||[]).filter((x,k,a)=>x&&a.indexOf(x)===k);
  let h=nav()+(ph.length?'<div class="slider">'+ph.map(u=>'<img src="'+esc(u)+'" loading="lazy">').join('')+'</div>':'')+'<div class="w"><div class="top"><a href="#" class="mu">← All trips</a><button class="lnk" data-t="'+esc(t.title)+'" onclick="shareTrip(this.dataset.t)">Share</button></div>';
  h+='<div class="top" style="margin-top:6px"><h1 style="font-size:26px">'+esc(t.title)+'</h1><span class="badge '+(on?'on':'soon')+'">'+(on?'Booking Open':closed(t)?'Closed':'Coming Soon')+'</span></div><p class="mu" style="margin:4px 0">'+route(t)+'</p>';
  h+='<div class="facts"><div class="fact"><span>Date</span><b>'+fd(t.trip_date)+'</b></div><div class="fact"><span>Departure</span><b>'+esc(t.trip_time||'TBA')+'</b></div><div class="fact"><span>Boarding point</span><b>'+esc(t.boarding||'TBA')+'</b></div>'+(t.kind==='train'&&t.vehicle_name?'<div class="fact"><span>Train</span><b>'+esc(t.vehicle_name)+'</b></div>':'')+(t.kind==='scorpio'?'<div class="fact"><span>Vehicle</span><b>'+esc(t.vehicle_name||'Scorpio')+' · '+(t.cars||1)+' × '+(t.per_car||7)+' packages</b></div>':'')+'<div class="fact"><span>Price</span><b style="color:var(--pr)">'+(t.price>0?'₹'+t.price+' / package':'TBA')+'</b></div></div>';
  h+=cdHTML(t,true);
  if(d.ov)h+='<div class="sec-card"><h3>Overview</h3><div class="ov">'+esc(d.ov)+'</div></div>';
  if(d.hl)h+='<div class="sec-card"><h3>Highlights</h3>'+list(lines(d.hl))+'</div>';
  h+=dayCards(d);
  if(d.inc||d.exc)h+='<div class="two">'+(d.inc?'<div class="sec-card"><h3>Included</h3>'+list(lines(d.inc))+'</div>':'')+(d.exc?'<div class="sec-card"><h3>Not included</h3>'+list(lines(d.exc),'x')+'</div>':'')+'</div>';
  if(d.pol)h+='<div class="sec-card"><h3>Cancellation &amp; policy</h3>'+list(lines(d.pol))+'</div>';
  if(!on){h+='<div class="warn">'+(closed(t)?'Booking is closed for this trip.':'Booking has not started for this trip yet.')+'</div>'+(S.set.wa?'<a class="btn wa" target="_blank" rel="noopener" href="'+waLink('Hi, please notify me when booking opens for: '+t.title)+'">Notify me on WhatsApp</a>':'')+'</div>'+foot();return $('root').innerHTML=h}
  h+='<h2 class="sec" style="margin-top:26px">'+(t.kind==='train'?'Passengers':'Choose your package')+' <span class="mu">('+left(t)+' of '+t.seats+' free)</span></h2>'+(t.kind==='train'?'<div class="sec-card c"><p class="mu" style="margin:0 0 8px">Number of passengers</p><div class="stp"><button type="button" class="btn alt sm" id="tm">−</button><b id="tn">1</b><button type="button" class="btn alt sm" id="tp">+</button></div><p class="mu" style="margin:10px 0 0">Tickets are confirmed by Indian Railways. We will send your confirmed ticket and PNR on WhatsApp.</p></div>':seatMap(t,false))+termsCard()+'<div class="sec-card"><div class="g2"><div><label>Your name</label><input id="nm"></div><div><label>Phone number</label><input id="ph" type="tel"></div></div><label class="chk"><input type="checkbox" id="tc"> I have read and agree to the Terms &amp; cancellation policy above</label></div></div>'+foot()+'<div class="sbar"><div class="in"><div><div id="sm" style="font-weight:600"></div><div id="st" class="mu"></div></div><button class="btn wa" id="go">'+(S.user?(S.set.upi?'Hold package & pay':'Book on WhatsApp'):'Sign in with Google to book')+'</button></div></div>';
  $('root').innerHTML=h;
  const train=t.kind==='train';
  const cnt=()=>train?tn:sel.size;
  const pick=()=>{if(!train)return[...sel];const m=S.st[t.id]||{},o=[];for(let q=1;q<=t.seats&&o.length<tn;q++){const l='T'+q;if(!m[l])o.push(l)}return o};
  const upd=()=>{const n=cnt();$('sm').textContent=n?n+(train?' passenger':' package')+(n>1?'s':'')+(t.price>0?' · ₹'+n*t.price:''):'Select your package';$('st').textContent=train?'Confirmed by Indian Railways':(sel.size?[...sel].map(fl).join(', '):'Tap a free package')};
  if(train){tn=Math.max(1,Math.min(tn,left(t),6));$('tn').textContent=tn;$('tm').onclick=()=>{if(tn>1){tn--;$('tn').textContent=tn;upd()}};$('tp').onclick=()=>{if(tn<Math.min(6,left(t))){tn++;$('tn').textContent=tn;upd()}}}
  upd();
  document.querySelectorAll('.seat').forEach(b=>b.onclick=()=>{const s=b.dataset.s;sel.has(s)?sel.delete(s):sel.add(s);b.classList.toggle('sel');upd()});
  document.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{const c=b.dataset.car,m=S.st[t.id]||{},free=[];for(let q=1;q<=t.per_car;q++){const l='C'+c+'S'+q;if(!m[l])free.push(l)}const all=free.length&&free.every(l=>sel.has(l));free.forEach(l=>{all?sel.delete(l):sel.add(l);const e=document.querySelector('.seat[data-s="'+l+'"]');e&&e.classList.toggle('sel',sel.has(l))});upd()});
  if(S.user&&$('nm')&&!$('nm').value)$('nm').value=(S.user.user_metadata&&S.user.user_metadata.full_name)||'';
  $('go').onclick=async()=>{
    if(!S.user)return gsign();
    if(!$('tc').checked)return alert('Please tick the box to agree to the Terms & cancellation policy.');
    const nm=$('nm').value.trim(),ph2=$('ph').value.trim(),labs=pick();
    if(!labs.length||(train&&labs.length<tn))return alert(train?'Not enough tickets left.':'Please select at least one package.');
    if(!nm||!ph2){$('nm').scrollIntoView({block:'center'});return alert('Please enter your name and phone number.')}
    $('go').disabled=true;
    const {data,error}=await sb.rpc('hold_seats',{p_trip:t.id,p_labels:labs,p_name:nm,p_phone:ph2});
    $('go').disabled=false;
    if(data==='login')return gsign();
    if(error||data!=='ok'){alert(data==='taken'?'Sorry, someone just took that. Please try again.':'Booking failed, please try again.');sel=new Set();await load();return render()}
    const msg='New '+(train?'train ticket request':'booking')+'\nTrip: '+t.title+'\nDate: '+fd(t.trip_date)+' '+(t.trip_time||'')+(t.vehicle_name?'\n'+(train?'Train':'Vehicle')+': '+t.vehicle_name:'')+'\n'+(train?'Passengers: '+labs.length:'Packages: '+labs.map(fl).join(', '))+'\nName: '+nm+'\nPhone: '+ph2+(t.price>0?'\nTotal: ₹'+labs.length*t.price:'')+'\n(Held for 15 minutes)';
    sel=new Set();tn=1;const tot=t.price>0?labs.length*t.price:0;
    if(S.set.upi&&tot>0)return payBox(t,tot,msg);
    if(!S.set.wa)return alert('Held! Please contact us to confirm.');
    location.href=waLink(msg);
  };
}

const CODECH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){const a=new Uint8Array(8);crypto.getRandomValues(a);return 'GT-'+[...a].map(x=>CODECH[x%32]).join('')}
const siteUrl=()=>location.origin+location.pathname;
const ticketUrl=c=>siteUrl()+'#ticket-'+c;
const cleanPh=p=>{const d=String(p||'').replace(/\D/g,'');return d.length===10?'91'+d:d};
async function gsign(){sessionStorage.setItem('ret',JSON.stringify({hash:location.hash,sel:[...sel],tn}));const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)alert(error.message)}
function ticketHTML(d,code){
  let qr='';try{const q=qrcode(0,'M');q.addData(ticketUrl(code));q.make();qr=q.createSvgTag(4)}catch(e){}
  const n=(d.seats||[]).length,tr=d.kind==='train';
  return '<div class="tk"><div class="hd"><div><div style="font-size:12px;opacity:.85;letter-spacing:.2em">E-TICKET</div><div style="font-size:18px;font-weight:700">Gouri Travels.in</div></div><div style="text-align:right"><img src="'+LOGO+'" alt=""><br><span class="ok">'+(tr?'RAILWAY CONFIRMED':'CONFIRMED')+'</span></div></div><div class="bd"><div class="big">'+esc(d.title)+'</div><div class="mu">'+route({from_place:d.from,to_place:d.to})+'</div>'
  +(d.vehicle?'<div class="lbl">'+(tr?'Train':'Vehicle')+'</div><div class="v">'+esc(d.vehicle)+'</div>':'')
  +'<div class="lbl">Date &amp; departure</div><div class="v">'+fd(d.date)+' · '+esc(d.time||'TBA')+'</div><div class="lbl">Boarding point</div><div class="v">'+esc(d.boarding||'TBA')+'</div><div class="lbl">Passenger</div><div class="v">'+esc(d.name)+' · ••••'+esc(d.phone)+'</div><div class="lbl">'+(tr?'Passengers':'Packages')+'</div><div class="chips">'+(tr?'<span>'+n+'</span>':(d.seats||[]).map(x=>'<span>'+esc(fl(x))+'</span>').join(''))+'</div>'
  +(d.note?'<div class="lbl">'+(tr?'PNR / coach &amp; berth':d.kind==='scorpio'?'Vehicle / driver':'Note')+'</div><div class="v">'+esc(d.note)+'</div>':'')
  +(d.price>0?'<div class="lbl">Fare</div><div class="v">₹'+d.price*n+' ('+n+' × ₹'+d.price+')</div>':'')
  +'<div class="cut"></div><div class="qr">'+qr+'</div><div class="code">'+esc(code)+'</div><p class="mu c">Show this ticket at the boarding point.</p></div></div>';
}
async function ticketPage(code){
  $('root').innerHTML=nav()+'<div class="w"><p class="mu c" style="margin-top:30px">Loading your ticket…</p></div>';
  const {data}=await sb.rpc('get_ticket',{p_code:code});
  if(!data)return $('root').innerHTML=nav()+'<div class="w"><div class="warn" style="margin-top:24px">Ticket not found. '+(S.user?'It may belong to another account.':'Please sign in with the Google account you used to book.')+'</div></div>'+foot();
  $('root').innerHTML=nav()+'<div class="w">'+ticketHTML(data,code)+'<div class="c noprint" style="margin-bottom:20px"><button class="btn" onclick="print()">Save / Print ticket</button></div></div>'+foot();
}
function pendCard(b){const tr=b.kind==='train',n=(b.seats||[]).length,what=tr?n+' passenger'+(n>1?'s':''):(b.seats||[]).map(fl).join(', ');const until=b.held_until?new Date(b.held_until).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
  return '<div class="sec-card"><div class="top"><h3>'+esc(b.title)+'</h3><span class="badge soon">Awaiting confirmation</span></div><p class="mu" style="margin:4px 0">'+fd(b.date)+' · '+esc(what)+'</p><p class="mu" style="margin:0">Held until '+until+'. We confirm once your payment is received on WhatsApp.</p>'+(S.set.upi&&b.price>0?'<p style="margin:10px 0 0"><a class="btn sm ye" href="'+esc(upiLink(b.price*n,b.title))+'">Pay ₹'+b.price*n+' with UPI</a></p>':'')+(S.set.wa?'<p style="margin:10px 0 0"><a class="btn sm" target="_blank" rel="noopener" href="'+waLink('Hi, my booking for '+b.title+' ('+what+')')+'">Message us on WhatsApp</a></p>':'')+'</div>'}
async function myPage(){
  if(!S.user)return $('root').innerHTML=nav()+'<div class="w c"><h2 class="sec">My bookings'+SCR+'</h2><p class="mu">Sign in with Google to see your bookings and tickets.</p><button class="btn" id="gi2">Sign in with Google</button></div>'+foot();
  $('root').innerHTML=nav()+'<div class="w"><p class="mu c" style="margin-top:30px">Loading…</p></div>';
  const {data}=await sb.rpc('my_bookings'),L=data||[];
  let h=nav()+'<div class="w"><h2 class="sec c">My bookings'+SCR+'</h2>';
  if(!L.length)h+='<p class="mu c">No bookings yet. <a href="#" style="color:var(--pr)">Browse trips</a></p>';
  L.forEach(b=>{h+=(b.status==='booked'&&b.ticket)?ticketHTML(b,b.ticket)+trackCard(b)+'<p class="c noprint" style="margin:-6px 0 22px"><a class="lnk" href="'+ticketUrl(b.ticket)+'">Open ticket page</a></p>':pendCard(b)});
  $('root').innerHTML=h+'</div>'+foot();
}
function bookingsTable(t,m){
  const rows=Object.values(m),held={},book={},other=[];
  rows.forEach(r=>{if(r.status==='held'){const k=(r.name||'')+'|'+(r.phone||'');(held[k]=held[k]||[]).push(r)}else if(r.ticket){(book[r.ticket]=book[r.ticket]||[]).push(r)}else other.push(r)});
  let h='<table>';
  Object.values(held).forEach(g=>{const r=g[0];h+='<tr><td>⏳ Held<br><b>'+(t.kind==='train'?g.length+' passenger(s)':g.map(x=>fl(x.label)).join(', '))+'</b></td><td>'+esc(r.name)+'<br>'+esc(r.phone)+'</td><td><button class="btn sm" data-a="cf" data-n="'+esc(r.name)+'" data-p="'+esc(r.phone)+'">Confirm &amp; make ticket</button></td></tr>'});
  Object.keys(book).forEach(c=>{const g=book[c],r=g[0],lbl=t.kind==='train'?g.length+' passenger(s)':g.map(x=>fl(x.label)).join(', ');
    const msg='Hi '+r.name+', your booking is confirmed ✅\nTrip: '+t.title+'\nDate: '+fd(t.trip_date)+' '+(t.trip_time||'')+'\nPackages: '+lbl+'\nYour e-ticket: '+ticketUrl(c);
    h+='<tr><td>✅ Booked<br><b>'+lbl+'</b></td><td>'+esc(r.name)+'<br>'+esc(r.phone)+'<br><span class="mu">'+esc(c)+'</span></td><td><a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/'+cleanPh(r.phone)+'?text='+encodeURIComponent(msg)+'">Send ticket</a> <a class="btn alt sm" target="_blank" href="'+ticketUrl(c)+'">View</a></td></tr>'});
  other.forEach(r=>{h+='<tr><td>'+r.label+'</td><td colspan="2">Booked manually</td></tr>'});
  return h+'</table>';
}
async function shrink(f){const im=await createImageBitmap(f),r=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}
async function up(tid,f){const p=tid+'/'+Date.now()+Math.random().toString(36).slice(2,6)+'.jpg';const {error}=await sb.storage.from('trip-photos').upload(p,await shrink(f),{contentType:'image/jpeg'});if(error){alert(error.message);return null}return sb.storage.from('trip-photos').getPublicUrl(p).data.publicUrl}

  const draw=()=>{box.innerHTML=A.map((x,i)=>'<div class="dcard"><div class="dh"><b>Day '+(i+1)+'</b><button type="button" class="btn red sm" data-dx="rm" data-i="'+i+'">Remove day</button></div><label>Day title (e.g. Digha beach &amp; sunset)</label><input data-dk="t" data-i="'+i+'" value="'+esc(x.t)+'">'+blk('🗺️ Where we go','d','dim',i,x,'Places we visit this day, one by one…')+blk('🍽️ Food menu','m','mim',i,x,'Breakfast, lunch, dinner…')+'</div>').join('')+'<button type="button" class="btn alt sm" data-dx="add">➕ Add Day '+(A.length+1)+'</button>'};
  draw();

    if(t.dataset.dt){A[i][t.dataset.dt+'On']=t.checked;draw()}

    else if(t.dataset.dx==='rm'){if(confirm('Remove Day '+(+t.dataset.i+1)+'?')){A.splice(+t.dataset.i,1);if(!A.length)A.push(newDay());draw()}}
    else if(t.dataset.ix){A[+t.dataset.i][t.dataset.ix].splice(+t.dataset.j,1);draw()}})}

  '<div id="tripsbox" class="'+(admTab==='set'?'hide':'')+'">'+(adm?'<button class="btn alt sm" id="bk" style="margin-bottom:12px">← All trips</button>':'<div class="top" style="margin:6px 0 12px"><h3>Trips ('+S.trips.length+')</h3><button class="btn sm" id="add">➕ New trip</button></div>'+tripList());

    AH('🏷️','Trip name &amp; price','Name, route, date, time and price per package')+'<div class="kinds">'+KIND_BTNS(t)+'</div><label>Trip title</label><input data-f="title" value="'+esc(t.title)+'"><div class="g2"><div><label>From</label><input data-f="from_place" value="'+esc(t.from_place)+'"></div><div><label>To</label><input data-f="to_place" value="'+esc(t.to_place)+'"></div><div><label>Date</label><input data-f="trip_date" type="date" value="'+(t.trip_date||'')+'"></div><div><label>Departure time</label><input data-f="trip_time" value="'+esc(t.trip_time)+'"></div><div><label>Price per package ₹</label><input data-f="price" type="number" value="'+t.price+'"></div><div class="kf-bus"><label>Number of packages</label><select data-x="seats_bus">'+[49,53,57].map(n=>'<option'+(n===t.seats?' selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="kf-train"><label>Tickets available</label><input data-x="seats_train" type="number" min="1" max="300" value="'+t.seats+'"></div><div class="kf-sc"><label>Number of cars</label><input data-x="cars" type="number" min="1" max="30" value="'+(t.cars||1)+'"></div></div><div class="kf-train"><label>Train name, number &amp; class</label><input data-x="vn_train" value="'+esc(t.vehicle_name)+'"></div><div class="kf-sc"><div class="g2"><div><label>Vehicle (e.g. Mahindra Scorpio)</label><input data-x="vn_sc" value="'+esc(t.vehicle_name)+'"></div><div><label>Packages per car</label><input data-x="per" type="number" min="2" max="12" value="'+(t.per_car||7)+'"></div></div></div><label>Boarding point</label><input data-f="boarding" value="'+esc(t.boarding)+'">'+
    AH('📝','About this trip','A short overview and highlights')+ta('ov','Overview (what is this trip about)',d.ov,4)+ta('hl','Highlights (one per line)',d.hl)+AH('🗺️','Day-wise plan, places &amp; food','One card per day: where we go, what we eat, with photos you can switch on or off')+'<div class="dayed" data-days></div>'+AH('📦','Package details','Booking close time, what is included, policy')+ta('cl','Booking closes at (YYYY-MM-DD HH:MM, 24-hour, e.g. 2026-12-10 18:00). Empty = no countdown',d.cl,1)+ta('inc','Included (one per line)',d.inc)+ta('exc','Not included (one per line)',d.exc)+ta('pol','Cancellation &amp; policy (one per line)',d.pol)+
    '<button class="btn sm" data-a="save">Save trip</button> '+(i>0?'<button class="btn alt sm" data-a="open">'+(t.open?'Set to Coming Soon':'Open booking')+'</button> ':'')+'<button class="btn red sm" data-a="del">Delete</button>'+

    '<h3>Photo gallery (reorder)</h3><div class="gal">'+ph.map((u,k)=>'<div><img src="'+esc(u)+'"><div class="ct"><button class="btn alt sm" data-a="l" data-k="'+k+'">◀</button><button class="btn alt sm" data-a="r" data-k="'+k+'">▶</button><button class="btn alt sm" data-a="th" data-k="'+k+'">⭐</button><button class="btn red sm" data-a="rm" data-k="'+k+'">✕</button></div></div>').join('')+'</div><input type="file" accept="image/*" multiple data-a="photos"><p class="mu">⭐ = set as thumbnail</p>'+

          upd(o)}
        else if(a==='open')upd({open:!t.open});
        else if(a==='del'){if(confirm('Delete this trip?')){await sb.from('trips').delete().eq('id',id);adm='';redo()}}

      }});
  });
