<style>
:root{--pr:#2563eb;--pd:#1d4ed8;--ac:#f59e0b;--ink:#0f1b3d;--mu:#5b6783;--bg:#f5f8ff;--cd:#fff;--bd:#e0e7f5;--bk:#d5dcec;--sh:0 1px 2px rgba(15,27,61,.05),0 10px 28px rgba(15,27,61,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'DM Sans','Noto Sans Bengali',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque','Noto Sans Bengali',sans-serif;font-weight:700;margin:0;line-height:1.15;letter-spacing:-.02em}
a{color:inherit}.w{max-width:1040px;margin:0 auto;padding:0 20px}.mu{color:var(--mu);font-size:14px}.c{text-align:center}
.nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.nin{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand img{height:36px;width:36px;object-fit:contain;border-radius:10px}.brand b{font:800 18px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}.brand b span{color:var(--ac)}
.acct{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--mu);flex-wrap:wrap;justify-content:flex-end}.acct a{color:var(--pr);font-weight:700;text-decoration:none}
.gbtn{background:#fff;border:1px solid var(--bd);border-radius:99px;padding:8px 16px;font:700 13px 'DM Sans',sans-serif;cursor:pointer;color:var(--ink)}
.lnk{background:none;border:0;font:700 14px 'DM Sans',sans-serif;color:var(--pr);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:end;padding-top:48px;padding-bottom:12px}
.pill{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--pr)}
.hero h1{font-size:clamp(40px,8vw,72px);margin:18px 0 16px;font-weight:800}.hero p{max-width:480px;font-size:17px;color:var(--mu);margin:0 0 24px}
.hbtn{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;gap:10px}.stat{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px 20px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center}.stat b{font:800 28px 'Bricolage Grotesque',sans-serif;color:var(--pr)}.stat span{font-size:13px;color:var(--mu)}
.notice{background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;margin:22px auto 0;font-size:14.5px}
h2.sec{font-size:clamp(26px,5vw,36px);margin:64px 0 22px;text-align:left}h2.sec svg{display:none}
.arches{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.arch{display:block;text-decoration:none;background:var(--cd);border:1px solid var(--bd);border-radius:24px;overflow:hidden;box-shadow:var(--sh);transition:transform .2s}.arch:hover{transform:translateY(-3px)}
.arch.big{grid-column:1/-1;display:grid;grid-template-columns:1.1fr 1fr}
.af{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#dbe7ff,#e0ecff);overflow:hidden}.af img{width:100%;height:100%;object-fit:cover;display:block}
.af .kd{position:absolute;left:12px;top:12px;margin:0;background:rgba(255,255,255,.92);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:.06em}
.af .st{position:absolute;right:12px;bottom:12px;background:var(--ac);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700}.af .st.off{background:var(--ink)}
.ab{padding:18px 20px 20px;display:flex;flex-direction:column;justify-content:center}.ab h3{font-size:21px}.arch.big .ab h3{font-size:clamp(24px,4vw,34px)}
.am{font-size:14px;color:var(--mu);margin:6px 0 12px}.ar{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.price{font:800 22px 'Bricolage Grotesque',sans-serif;color:var(--pr)}
.bar{height:6px;background:var(--bd);border-radius:9px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding-top:30px}.arch.big{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:99px;padding:13px 26px;background:var(--pr);color:#fff;font:700 15px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--pd)}.btn.alt{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}.btn.ye{background:var(--ac);color:#fff}.btn.wa{background:var(--pr)}.btn.red{background:#b3261e}
.btn.sm{padding:7px 15px;font-size:13px}.btn:disabled{opacity:.5}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.wy{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:20px}.wy i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#dbe7ff;color:var(--pr);font:800 16px 'Bricolage Grotesque',sans-serif;font-style:normal;margin-bottom:12px}.wy h3{font-size:18px;margin-bottom:6px}.wy p{margin:0;font-size:14.5px;color:var(--mu)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.step{background:var(--ink);color:#fff;border-radius:22px;padding:22px}.step i{font:800 40px 'Bricolage Grotesque',sans-serif;color:var(--ac);font-style:normal}.step h3{font-size:19px;margin:6px 0}.step .gl{display:none}.step p{margin:0;font-size:14.5px;opacity:.8}
.rev{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:18px 20px;margin:12px 0;font-size:16px}.rev .mu{margin-top:6px}
details{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin:10px 0}summary{cursor:pointer;font-weight:700}details p{margin:8px 0 0;color:var(--mu)}
.ft{background:var(--ink);color:#fff;margin-top:72px;padding:52px 0 30px;border-radius:32px 32px 0 0}.ft h2{font-size:clamp(28px,6vw,44px);color:#fff}.circ{color:var(--ac)}.circ svg{display:none}
.gl2{height:1px;background:rgba(255,255,255,.15);margin:26px 0 20px}.sm{letter-spacing:.12em;font-size:12px;margin:0 0 16px;opacity:.7}
.cts{display:flex;gap:14px;flex-wrap:wrap}.ct2{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 18px}
.ct2 i{font-style:normal;font-size:22px}.ct2 span{font-size:11px;letter-spacing:.12em;opacity:.8}.ct2 b{display:block;font:700 17px 'DM Sans',sans-serif;letter-spacing:0}.cp{margin:30px 0 0;font-size:12.5px;opacity:.6}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;overflow:hidden;display:block;color:inherit;text-decoration:none}
.pad{padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{font-size:13px;font-weight:700;padding:4px 14px;border-radius:99px;white-space:nowrap}
.on{background:var(--pr);color:#fff}.soon{background:#fff;color:var(--mu);border:1px solid var(--bd)}
.slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 20px}.slider img{height:300px;min-width:78%;max-width:420px;object-fit:cover;border-radius:22px;scroll-snap-align:center}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.fact{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px 16px}.fact span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.fact b{font:700 17px 'DM Sans',sans-serif}
.sec-card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:20px;margin:14px 0;box-shadow:var(--sh)}.sec-card h3{margin-bottom:12px;font-size:19px}
.ov{white-space:pre-wrap}.ul{list-style:none;padding:0;margin:0}.ul li{padding:5px 0 5px 26px;position:relative}.ul li:before{content:"✓";position:absolute;left:0;color:var(--pr);font-weight:700}.ul.x li:before{content:"✕";color:#b3261e}
.tl{border-left:2px solid var(--bd);margin-left:8px;padding-left:18px}.tl div{position:relative;padding:6px 0 10px}.tl div:before{content:"";position:absolute;left:-25px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:3px solid var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bus{background:#fff;border:2px solid var(--bd);border-radius:30px;padding:16px;max-width:310px;margin:14px auto}
.drv{text-align:right;color:var(--mu);font-size:13px}.row{display:flex;gap:6px;justify-content:center;margin:6px 0}.gap{width:26px}
.seat{width:44px;height:44px;border-radius:12px;border:2px solid var(--pr);background:#fff;color:var(--ink);font:700 12px 'DM Sans',sans-serif;cursor:pointer}
.seat.bk{background:var(--bk);border-color:var(--bk);color:var(--mu);cursor:not-allowed;text-decoration:line-through}
.seat.hd{background:var(--ac);border-color:var(--ac);color:#fff;cursor:not-allowed}.seat.sel{background:var(--pr);color:#fff}
.seat.ad.bk{background:#b3261e;border-color:#b3261e;color:#fff;text-decoration:none;cursor:pointer}.seat.ad.hd{cursor:pointer}
.leg{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mu);flex-wrap:wrap}.leg i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:2px solid var(--pr)}

 return '<div class="sec-card trk noprint"><h3>Cancellation tracker</h3><p class="mu" style="margin:0 0 10px">Confirmed '+new Date(c).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})+' · '+(h<48?Math.floor(h)+' hours':Math.floor(h/24)+' days')+' ago</p><div class="trkp"><b>'+p+'%</b><span>deducted if you cancel now'+(tot>0?'<br>Refund ₹'+Math.round(tot*(100-p)/100)+' of ₹'+tot:'')+'</span></div>'+(nx&&cur[0]<9999?'<p class="mu" style="margin:10px 0">Deduction rises to <b>'+nx[1]+'%</b> in <b data-cd="'+(new Date(c).getTime()+cur[0]*36e5)+'" data-lb=""></b></p>':'')+(S.set.wa?'<a class="btn alt sm" target="_blank" rel="noopener" href="'+waLink('Cancellation request\nTicket: '+b.ticket+'\nTrip: '+b.title+'\nName: '+(b.name||'')+'\nDeduction now: '+p+'%')+'">Request cancellation</a>':'')+'</div>'}

async function load1(){
  const ses=(await sb.auth.getSession()).data.session,user=ses?ses.user:null;let ok=false;
  if(user){const r=await sb.rpc('is_admin');if(r.error)throw r.error;ok=r.data===true}
  const [t,st,se]=await Promise.all([sb.from('trips').select('*').order('created_at',{ascending:false}),sb.from(ok?'seats':'seat_status').select('*'),sb.from('settings').select('*')]);
  const e=t.error||st.error||se.error;if(e)throw e;
  S.user=user;S.admin=ok;S.trips=t.data||[];S.st={};
  (st.data||[]).forEach(r=>{if(r.status==='held'&&r.held_until&&new Date(r.held_until)<new Date())return;(S.st[r.trip_id]=S.st[r.trip_id]||{})[r.label]=r});
  (se.data||[]).forEach(r=>S.set[r.key]=r.value);
}
async function load(){let err;for(let k=0;k<3;k++){try{await load1();return}catch(e){err=e;await new Promise(r=>setTimeout(r,500*(k+1)))}}throw err}

    bookingsTable(t,m)+'<div style="position:sticky;bottom:0;z-index:30;padding:10px 0;background:#fff;box-shadow:0 -6px 12px rgba(0,0,0,.08)"><button class="btn" data-a="save" style="width:100%">💾 Save trip</button></div></div>'});
  $('root').innerHTML=h+'</div></div>';
  $('lo').onclick=async()=>{await sb.auth.signOut();redo()};
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{adm=e.dataset.open;admin();scrollTo(0,0)});
  if($('bk'))$('bk').onclick=()=>{adm='';admin();scrollTo(0,0)};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{admTab=b.dataset.tab;adm='';admin();scrollTo(0,0)});
  document.querySelectorAll('[data-bkp] [data-a="cf"]').forEach(b=>b.onclick=()=>{const t=S.trips.find(x=>x.id===b.closest('[data-bkp]').dataset.tid);if(t)cfBook(t,b)});
  $('ss').onclick=async()=>{const {error}=await sb.from('settings').upsert([{key:'wa',value:$('wa').value.trim()},{key:'phone',value:$('phn').value.trim()},{key:'reviews',value:$('rv').value},{key:'faq',value:$('fq').value},{key:'upi',value:$('upi').value.trim()},{key:'upi_name',value:$('upn').value.trim()},{key:'tag',value:$('tg').value.trim()},{key:'notice',value:$('nt').value.trim()},{key:'why',value:$('wh').value},{key:'slabs',value:$('sl').value.trim()},{key:'terms',value:$('tm').value}]);if(error)alert(error.message);else alert('Saved');redo()};
  const saveHero=async l=>{const {error}=await sb.from('settings').upsert([{key:'hero',value:l.join('\n')}]);if(error)alert(error.message);redo()};
  if($('hfile'))$('hfile').onchange=async e=>{const l=heroList();for(const f of e.target.files){const u=await up('hero',f);if(u)l.push(u)}await saveHero(l)};
  document.querySelectorAll('[data-hx]').forEach(b=>b.onclick=()=>{const l=heroList();l.splice(+b.dataset.hx,1);saveHero(l)});
  if($('add'))$('add').onclick=async()=>{await sb.from('trips').insert({title:'New trip',from_place:'Bandel',open:true});redo()};
  document.querySelectorAll('.sec-card[data-id]').forEach(c=>{
    const id=c.dataset.id,t=S.trips.find(x=>x.id===id),ph=[...(t.photos||[])];
    const upd=async o=>{let r=await sb.from('trips').update(o).eq('id',id).select('id');
      if(r.error&&'trip_time' in o&&/time|trip_time/i.test(r.error.message||'')){o={...o,trip_time:null};r=await sb.from('trips').update(o).eq('id',id).select('id')}
      const {data,error}=r;if(error){console.error('Trip save error',error);alert('Trip not saved:\n'+error.message+(error.details?'\n'+error.details:'')+(error.hint?'\n'+error.hint:''))}else if(!data||!data.length)alert('Not saved. Your admin login may have expired. Please log out and log in again.');else toast('✅ Saved');redo()};dayInit(c,id);
    c.querySelectorAll('.ksw').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k===c.dataset.kind)return;if(taken(t)&&!confirm('This trip already has bookings. Changing the type can break them. Continue?'))return;c.dataset.kind=k;c.querySelectorAll('.ksw').forEach(x=>x.classList.toggle('on',x===b))});
    c.querySelectorAll('[data-m] .seat').forEach(b=>b.onclick=async()=>{const s=b.dataset.s,x=(S.st[id]||{})[s];
      if(x){await sb.from('seats').delete().eq('trip_id',id).eq('label',s)}else{await sb.from('seats').insert({trip_id:id,label:s,status:'booked',name:'Admin'})}redo()});
    c.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a,k=+b.dataset.k;
      if(b.type==='file'){b.onchange=async()=>{const fs=[...b.files];if(!fs.length)return;b.disabled=true;
        if(a==='thumb'){const u=await up(id,fs[0]);if(u)upd({thumb:u});else b.disabled=false}
        else{const us=[];for(const f of fs){const u=await up(id,f);if(u)us.push(u)}if(us.length)upd({photos:ph.concat(us)});else b.disabled=false}};return}
      b.onclick=async()=>{
        if(a==='save'){try{const o={},sec={};c.querySelectorAll('[data-f]').forEach(e=>{const f=e.dataset.f;o[f]=['price','seats'].includes(f)?(+e.value||0):(f==='trip_date'&&!e.value?null:e.value)});c.querySelectorAll('[data-sec]').forEach(e=>sec[e.dataset.sec]=e.value.trim());sec.days=JSON.stringify((DAYS[id]||[]).filter(x=>x.t||x.d||x.m||x.dim.length||x.mim.length));o.details=pack(sec);const kind=c.dataset.kind||'bus';o.kind=kind;const X=n=>{const e=c.querySelector('[data-x="'+n+'"]');return e?e.value:''};
          if(kind==='bus'){o.seats=+X('seats_bus')||49;o.cars=null;o.per_car=null;o.vehicle_name=null}
          else if(kind==='train'){o.seats=Math.min(300,Math.max(1,+X('seats_train')||1));o.cars=null;o.per_car=null;o.vehicle_name=X('vn_train')}
          else{const cars=Math.max(1,+X('cars')||1),per=Math.max(2,+X('per')||7);if(cars*per>300)return alert('Too many packages (max 300)');o.cars=cars;o.per_car=per;o.seats=cars*per;o.vehicle_name=X('vn_sc')||'Scorpio'}
          upd(o)}catch(err){console.error(err);alert('Save failed: '+err.message)}}
        else if(a==='open')upd({open:!t.open});
        else if(a==='del'){if(confirm('Delete this trip?')){await sb.from('trips').delete().eq('id',id);adm='';redo()}}
        else if(a==='rm'){ph.splice(k,1);upd({photos:ph})}
        else if(a==='th')upd({thumb:ph[k]});
        else if(a==='l'&&k>0){[ph[k-1],ph[k]]=[ph[k],ph[k-1]];upd({photos:ph})}
        else if(a==='r'&&k<ph.length-1){[ph[k+1],ph[k]]=[ph[k],ph[k+1]];upd({photos:ph})}
        else if(a==='cf'){let note='';if(t.kind==='train'||t.kind==='scorpio'){note=prompt(t.kind==='train'?'PNR / coach & berth (optional):':'Vehicle number / driver (optional):');if(note===null)return}const code=newCode();const {error}=await sb.from('seats').update({status:'booked',held_until:null,ticket:code,note:note.trim()||null}).eq('trip_id',id).eq('status','held').eq('name',b.dataset.n).eq('phone',b.dataset.p);if(!error)await sb.from('settings').upsert([{key:'cf_'+code,value:new Date().toISOString()}]);if(error)alert(error.message+'\nDid you run the ticket SQL in Supabase?');redo()}
      }});
  });
}
function render(){
  clearInterval(timer);const h=location.hash.slice(1);window.scrollTo(0,0);
  if(h==='admin')return admin();
  if(h==='my')return myPage();
  if(h.startsWith('ticket-'))return ticketPage(h.slice(7));
  const i=S.trips.findIndex(t=>'t-'+t.id===h);
  if(i>=0){trip(S.trips[i],i);timer=setInterval(async()=>{const a=document.activeElement;if(a&&(a.tagName==='INPUT'))return;await load();const s=new Set(sel);sel=new Set([...s].filter(x=>!(S.st[S.trips[i].id]||{})[x]));const n=$('nm')?$('nm').value:'',p=$('ph')?$('ph').value:'';const y=scrollY;trip(S.trips[i],i);if($('nm')){$('nm').value=n;$('ph').value=p}scrollTo(0,y)},20000);return}
  home();
}
addEventListener('hashchange',()=>{if(!keep)sel=new Set();keep=false;render()});
document.addEventListener('click',async e=>{const t=e.target.closest('#gi,#gi2,#so');if(!t)return;if(t.id==='so'){await sb.auth.signOut();S.user=null;S.admin=false;await load();location.hash='';render()}else gsign()});
if(!READY)$('root').innerHTML='<div class="w"><div class="warn">'+(SB_URL.startsWith('YOUR_')?'Set SB_URL and SB_KEY at the top of index.html.':'Supabase library failed to load. Check your internet, or open the site on GitHub Pages.')+'</div></div>';
else load().then(()=>{
  const rt=sessionStorage.getItem('ret');
  if(rt){sessionStorage.removeItem('ret');try{const o=JSON.parse(rt);if(S.user){sel=new Set(o.sel||[]);tn=o.tn||1;keep=true;location.hash=o.hash||'';setTimeout(()=>{keep=false},600)}}catch(e){}}
  render();
}).catch(e=>{$('root').innerHTML='<div class="w"><div class="warn" style="margin-top:24px">Could not load the data. Check your internet. <button class="btn sm" onclick="location.reload()">Retry</button></div></div>'});
</script></body></html>
